<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Casse du siècle — cartes à imprimer</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  /* Planche de cartes prototype (63 × 88 mm, format poker).
     Imprimer en A4, échelle 100 %, sans marges ajoutées. */
  @page { size: A4; margin: 8mm; }
  body { font-family: Georgia, serif; margin: 0; background: #ddd; }
  .info { font-family: system-ui, sans-serif; padding: 12px; background: #fff; }
  .info button { font-size: 16px; padding: 8px 14px; }
  .planche { display: flex; flex-wrap: wrap; gap: 0; justify-content: flex-start; padding: 0; }
  .carte { width: 63mm; height: 88mm; border: 0.3mm dashed #999; background: #fff; box-sizing: border-box;
           display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5mm; page-break-inside: avoid; }
  .carte .famille { font-family: system-ui, sans-serif; font-size: 7pt; letter-spacing: .2em; text-transform: uppercase; color: #8a6d2a; }
  .carte .nom { font-size: 15pt; text-align: center; }
  .carte .qr svg { width: 38mm; height: 38mm; display: block; }
  .carte .code { font-family: monospace; font-size: 7pt; color: #888; }
  .carte.plan .lettre { font-size: 24pt; color: #8a6d2a; line-height: 1; }
  .carte.plan table { font-family: system-ui, sans-serif; font-size: 7.5pt; border-collapse: collapse; width: 100%; }
  .carte.plan td { padding: 0.8mm 0.5mm; border-bottom: 0.2mm solid #ddd; }
  .carte.plan td:nth-child(2) { color: #aaa; text-align: center; }
  .pic { width: 4.5mm; height: 4.5mm; vertical-align: middle; fill: none; stroke: #8a6d2a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  @media print { .info { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<div class="info">
  <b>Cartes prototype</b> — 32 outils (16 × 2), 3 cartes du milieu (Planquez-vous !, Os, Court-circuit), 6 Plans (sans QR).
  QR standard (pas de Micro QR). Imprimer à l'échelle 100 %.
  <button onclick="print()">Imprimer</button>
</div>
<div class="planche" id="planche"></div>
<script>
const outils = ['Perceuse', 'Stéthoscope', 'Pied-de-biche', 'Crochet', 'Aimant', 'Chalumeau', 'Ventouse', 'Scie à métaux',
                'Marteau', 'Tournevis', 'Lampe torche', 'Corde', 'Pince coupante', 'Loupe', 'Clé à molette', 'Dynamite'];
const cartes = [];
for (let i = 1; i <= 32; i++) cartes.push(['Outil', outils[Math.floor((i - 1) / 2)], 'CASSE:O' + String(i).padStart(2, '0')]);
cartes.push(['Milieu de table', 'Planquez-vous !', 'CASSE:P01']);
cartes.push(['Milieu de table', 'Os à moelle', 'CASSE:C01']);
cartes.push(['Milieu de table', 'Court-circuit', 'CASSE:B01']);

const planche = document.getElementById('planche');
cartes.forEach(([famille, nom, code]) => {
  let svg = '<div style="width:38mm;height:38mm;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;font:8pt system-ui">QR indisponible (connexion ?)</div>';
  if (window.qrcode) { const qr = qrcode(0, 'M'); qr.addData(code); qr.make(); svg = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  const d = document.createElement('div'); d.className = 'carte';
  d.innerHTML = `<div class="famille">${famille}</div><div class="nom">${nom}</div><div class="qr">${svg}</div><div class="code">${code}</div>`;
  planche.appendChild(d);
});

// Cartes Plan (pas de QR : seul le Cerveau les regarde). Même tableau que dans index.html.
const sons = ['Tic-tac', 'Grincement', 'Bips', 'Cliquetis', 'Bourdon', 'Craquement'];
// Mêmes pictos que dans index.html (tracés SVG, grille 24 × 24)
const pictos = [
  'M7 21 L12 3 L17 21 Z M12 18 L16 7',
  'M2 12 L5 5 L8 19 L11 5 L14 19 L17 5 L20 19 L22 12',
  'M2 16 H5 V8 H8 V16 H11 V8 H14 V16 H17 V8 H20 V16 H22',
  'M3 14 V10 M6 17 V7 M9 13 V11 M12 19 V5 M15 15 V9 M18 17 V7 M21 13 V11',
  'M2 18 Q4 14 6 18 T10 15 T14 11 T18 7 T22 4',
  'M12 2 L10 8 L14 11 L9 16 L12 22 M10 8 L4 10 M14 11 L20 9 M9 16 L5 19'
];
const svgPicto = (i) => `<svg viewBox="0 0 24 24" class="pic"><path d="${pictos[i]}"/></svg>`;
const PLANS = [
  [[12, 15], [4, 14], [5, 6], [3, 8], [0, 1], [7, 13]],
  [[9, 11], [6, 12], [8, 15], [0, 5], [4, 13], [2, 10]],
  [[6, 10], [2, 9], [1, 3], [7, 14], [5, 8], [11, 15]],
  [[0, 14], [7, 10], [2, 11], [1, 12], [9, 15], [3, 4]],
  [[7, 8], [1, 5], [0, 13], [4, 10], [2, 12], [9, 14]],
  [[1, 4], [3, 13], [7, 9], [6, 11], [10, 14], [8, 12]]
];
PLANS.forEach((plan, p) => {
  const d = document.createElement('div'); d.className = 'carte plan';
  d.innerHTML = `<div class="famille">Plan de la banque</div><div class="lettre">${'ABCDEF'[p]}</div>
    <table>${sons.map((son, i) => `<tr><td>${svgPicto(i)} ${son}</td><td>→</td><td><b>${outils[plan[i][0]]}</b><br><b>${outils[plan[i][1]]}</b></td></tr>`).join('')}</table>
    <div class="code">${p + 1} coup${p ? 's' : ''} de cloche</div>`;
  planche.appendChild(d);
});
</script>
</body>
</html>
